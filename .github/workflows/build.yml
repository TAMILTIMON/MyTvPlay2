name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make sure Android SDK 34 is installed
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Version number (used by in-app auto-update)
        run: echo "VCODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tcp.jks"
            echo "TCP_KEYSTORE=$RUNNER_TEMP/tcp.jks" >> "$GITHUB_ENV"
            echo "Signing with your fixed TamilCastPlay key"
          else
            echo "::warning::No KEYSTORE_B64 secret found - building with a temporary key (updates may not install over older builds)"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APKs
        env:
          TCP_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          TCP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TCP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$TCP_KEYSTORE" ]; then
            gradle assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TamilCastPlay-apk
          path: app/build/outputs/apk/**/*.apk

      - name: Publish release (the TV app checks this for updates)
        if: env.TCP_KEYSTORE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VCODE }}
          name: TamilCastPlay build ${{ env.VCODE }}
          body: Automatic build from commit ${{ github.sha }}
          files: app/build/outputs/apk/release/*.apk
          make_latest: true
