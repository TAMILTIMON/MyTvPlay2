plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mytv.player'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mytv.player'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    // One APK per CPU type keeps the download small. "universal" works on every TV.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // VLC engine: plays almost every format/codec, equalizer, volume boost, subtitles, tracks.
    implementation 'org.videolan.android:libvlc-all:3.6.2'

    // Phone web page / remote control.
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Magnet / .torrent streaming.
    implementation 'org.libtorrent4j:libtorrent4j:2.1.0-35'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm:2.1.0-35'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-35'
}
