plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mytv.player'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tamil.castplay'
        minSdk 21
        targetSdk 34
        versionCode = (System.getenv('VCODE') ?: '34').toInteger()
        versionName = '9.3.1' + (System.getenv('VCODE') ? '.' + System.getenv('VCODE') : '')
    }

    // Two variants from the same code — every feature is in both:
    //   full = the APKs you install yourself (exactly as before: Android 14 target, auto-update from GitHub)
    //   play = the Google Play AAB (targets Android 15 as Play requires; updates come from Play)
    flavorDimensions = ['store']
    productFlavors {
        full {
            dimension 'store'
            // ONE fixed Android version code for the self-installed app: Android then accepts older builds too,
            // so "Updates → Earlier versions" can roll back. (Higher than every earlier build, so they update to it.)
            // Which build is newer comes from the build number at the end of the version name.
            versionCode 2000000
        }
        play {
            dimension 'store'
            targetSdk 35
        }
    }

    // Three APKs, as before: arm64-v8a (64-bit phones / TVs), armeabi-v7a (32-bit Android — many TVs),
    // and universal (both, installs anywhere). The in-app updater picks the one for the device.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    // Fixed signing key from GitHub Secrets -> every build installs over the previous one.
    signingConfigs {
        if (System.getenv('TCP_KEYSTORE')) {
            tcp {
                storeFile file(System.getenv('TCP_KEYSTORE'))
                storePassword System.getenv('TCP_STORE_PASSWORD')
                keyAlias System.getenv('TCP_KEY_ALIAS')
                keyPassword System.getenv('TCP_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('TCP_KEYSTORE')) signingConfig signingConfigs.tcp
        }
        debug {
            if (System.getenv('TCP_KEYSTORE')) signingConfig signingConfigs.tcp
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true          // the WireGuard library uses newer Java parts on old Android
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// APK file: ZHPlay-arm64-v8a-release.apk (one app for phone + TV)
base {
    archivesName = 'ZHPlay'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Google sign-in (Credential Manager + Sign in with Google) and QR codes for TV sign-in
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.zxing:core:3.5.3'
    // instant broadcast notifications (Firebase Cloud Messaging; set up from admin/access.json, no google-services.json)
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'

    // VLC engine: plays almost every format/codec, equalizer, volume boost, subtitles, tracks.
    implementation 'org.videolan.android:libvlc-all:3.6.2'

    // Phone web page / remote control.
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Built-in VPN: WireGuard's official Android library (uses the profile the user imports)
    implementation 'com.wireguard.android:tunnel:1.0.20230706'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // Magnet / .torrent streaming.
    implementation 'org.libtorrent4j:libtorrent4j:2.1.0-35'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm:2.1.0-35'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-35'
}

// ---- ZH Play feature app icons ("ZH Browser", "ZH VPN", … in the phone's app list)
// For each feature: if you added your own logo  src/main/res/drawable-nodpi/zh_widget_<feature>.png
// the app icon uses it (edge to edge, its border colour filling the edges, like the widgets);
// otherwise the generated icon (symbol on its colour). Written on every build into build/generated/zhicons.
def zhIconsDir = file('build/generated/zhicons/res')
android.sourceSets.main.res.srcDir(zhIconsDir)
// older versions kept fixed copies of these icons in src/main/res — they'd clash ("Duplicate resources"), so clear them
['drawable', 'drawable-anydpi-v26'].each { dir ->
    File d = file("src/main/res/${dir}")
    if (d.isDirectory()) {
        d.listFiles().findAll { it.name.startsWith('zh_feat_') && it.name.endsWith('.xml') }.each { it.delete() }
        if (dir == 'drawable-anydpi-v26' && d.listFiles().length == 0) d.delete()
    }
}

def zhEdgeColor(File f) {
    try {
        def img = javax.imageio.ImageIO.read(f)
        if (img == null) return '#FFFFFFFF'
        long r = 0, g = 0, b = 0, n = 0
        int w = img.getWidth(), h = img.getHeight()
        int step = Math.max(1, (int) (Math.min(w, h) / 40))
        def take = { int x, int y ->
            int px = img.getRGB(x, y)
            if (((px >> 24) & 0xFF) > 200) {
                r += (px >> 16) & 0xFF; g += (px >> 8) & 0xFF; b += px & 0xFF; n++
            }
        }
        for (int i = 0; i < w; i += step) { take(i, 0); take(i, h - 1) }
        for (int j = 0; j < h; j += step) { take(0, j); take(w - 1, j) }
        if (n == 0) return '#FFFFFFFF'
        return String.format('#FF%02X%02X%02X', (int) (r / n), (int) (g / n), (int) (b / n))
    } catch (Exception e) {
        return '#FFFFFFFF'
    }
}

['browser', 'player', 'videos', 'music', 'gallery', 'vpn', 'seedr', 'remote', 'files', 'board', 'dj', 'editor', 'library', 'eq'].each { id ->
    File logo = ['png', 'jpg'].collect { file("src/main/res/drawable-nodpi/zh_widget_${id}.${it}") }.find { it.exists() }
    File v26 = new File(zhIconsDir, 'drawable-anydpi-v26')
    File base = new File(zhIconsDir, 'drawable')
    v26.mkdirs()
    base.mkdirs()
    if (logo != null) {
        String edge = zhEdgeColor(logo)
        new File(v26, "zh_feat_${id}.xml").text = """<?xml version="1.0" encoding="utf-8"?>
<!-- generated: your logo zh_widget_${id} -->
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background>
        <shape android:shape="rectangle">
            <solid android:color="${edge}" />
        </shape>
    </background>
    <foreground>
        <inset android:drawable="@drawable/zh_widget_${id}" android:inset="14%" />
    </foreground>
</adaptive-icon>
"""
        new File(base, "zh_feat_${id}.xml").text = """<?xml version="1.0" encoding="utf-8"?>
<!-- generated: your logo zh_widget_${id} -->
<layer-list xmlns:android="http://schemas.android.com/apk/res/android">
    <item android:drawable="@drawable/zh_widget_${id}" />
</layer-list>
"""
    } else {
        new File(v26, "zh_feat_${id}.xml").text = """<?xml version="1.0" encoding="utf-8"?>
<!-- generated: the ZH Play symbol for ${id} -->
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@drawable/zh_featbg_${id}" />
    <foreground>
        <inset android:drawable="@drawable/zh_glyph_${id}" android:inset="33%" />
    </foreground>
</adaptive-icon>
"""
        new File(base, "zh_feat_${id}.xml").text = """<?xml version="1.0" encoding="utf-8"?>
<!-- generated: the ZH Play symbol for ${id} -->
<layer-list xmlns:android="http://schemas.android.com/apk/res/android">
    <item android:drawable="@drawable/zh_featbg_${id}" />
    <item android:left="12dp" android:top="12dp" android:right="12dp" android:bottom="12dp"
        android:drawable="@drawable/zh_glyph_${id}" />
</layer-list>
"""
    }
}
